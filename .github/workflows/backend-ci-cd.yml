name: Backend CI/CD - Probability

on:
  push:
    branches:
      - main
    paths:
      - 'back/central/**'
      - 'back/migration/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  # No cancelar: si se mata un build mientras sube capas a ECR, el siguiente
  # arma un manifiesto que referencia capas a medio subir y el deploy falla con
  # "content digest not found". Que el anterior termine y este espere su turno.
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 476702565908
  IMAGE_NAME: backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: back/central/go.sum

      - name: Ejecutar tests unitarios
        working-directory: ./back/central
        run: |
          echo "=========================================="
          echo "  EJECUTANDO TESTS UNITARIOS - BACKEND"
          echo "=========================================="

          # TODO: Remover exclusión cuando se corrijan los tests de WhatsApp messaging
          EXCLUDE_PATTERN="messaging/whatsapp/internal/app/usecasemessaging|messaging/whatsapp/internal/app/usecasetestconnection"

          PACKAGES=$(go list ./... | grep -vE "$EXCLUDE_PATTERN")

          if go test $PACKAGES; then
            echo ""
            echo "=========================================="
            echo "  ✅ TODOS LOS TESTS PASARON"
            echo "  Continuando con build y deploy..."
            echo "=========================================="
          else
            echo ""
            echo "=========================================="
            echo "  ❌ TESTS FALLARON - DEPLOY BLOQUEADO"
            echo "=========================================="
            echo ""
            echo "  Los tests unitarios del backend fallaron."
            echo "  El build y deploy NO se ejecutarán hasta"
            echo "  que se corrijan los tests."
            echo ""
            echo "  Para reproducir localmente:"
            echo "    cd back/central"
            echo "    go test ./..."
            echo ""
            echo "=========================================="
            exit 1
          fi

  build-and-push:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-24.04-arm  # Runner ARM64 nativo - más rápido y barato
    permissions:
      contents: write  # Necesario para crear y push de tags
    outputs:
      version_full: ${{ steps.version.outputs.VERSION_FULL }}
      version_short: ${{ steps.version.outputs.VERSION_SHORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: back/central/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Generate version
        id: version
        run: |
          chmod +x .github/scripts/generate-version.sh
          .github/scripts/generate-version.sh probability-backend us-east-1 476702565908

      - name: Build image with Docker (ARM64)
        working-directory: ./back
        run: |
          VERSION_FULL="${{ steps.version.outputs.VERSION_FULL }}"
          VERSION_SHORT="${{ steps.version.outputs.VERSION_SHORT }}"
          SHORT_SHA="${{ steps.version.outputs.SHORT_SHA }}"

          REPO_URL="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/probability-backend"

          docker build \
            --platform linux/arm64 \
            --no-cache \
            -f central/docker/Dockerfile \
            -t ${REPO_URL}:latest \
            -t ${REPO_URL}:${VERSION_FULL} \
            -t ${REPO_URL}:${VERSION_SHORT} \
            -t ${REPO_URL}:${SHORT_SHA} \
            .

          echo "✅ Imagen construida con 4 tags:"
          echo "   - latest"
          echo "   - ${VERSION_FULL}"
          echo "   - ${VERSION_SHORT}"
          echo "   - ${SHORT_SHA}"

      - name: Push image to ECR
        run: |
          VERSION_FULL="${{ steps.version.outputs.VERSION_FULL }}"
          VERSION_SHORT="${{ steps.version.outputs.VERSION_SHORT }}"
          SHORT_SHA="${{ steps.version.outputs.SHORT_SHA }}"

          REPO_URL="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/probability-backend"

          echo "📤 Pushing tags to ECR..."
          docker push ${REPO_URL}:latest
          docker push ${REPO_URL}:${VERSION_FULL}
          docker push ${REPO_URL}:${VERSION_SHORT}
          docker push ${REPO_URL}:${SHORT_SHA}

          echo "✅ 4 tags pushed successfully"

      - name: Create Git Tag
        run: |
          VERSION_TAG="v${{ steps.version.outputs.VERSION_SHORT }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Eliminar tag local si existe
          git tag -d "${VERSION_TAG}" 2>/dev/null || true

          # Crear tag
          git tag -a "${VERSION_TAG}" -m "Release ${VERSION_TAG} - Backend

          Image: probability-backend:${{ steps.version.outputs.VERSION_FULL }}
          Commit: ${{ github.sha }}"

          # Push forzado del tag (sobrescribe si existe en remoto)
          git push origin "${VERSION_TAG}" --force
          echo "✅ Git tag created/updated: ${VERSION_TAG}"

  deploy:
    name: Deploy to Server (SSM)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Preparar artefactos
        run: |
          mkdir -p artifacts
          cp infra/compose-prod/docker-compose.yaml artifacts/
          if [ -f infra/compose-prod/prometheus.yml ]; then
            cp infra/compose-prod/prometheus.yml artifacts/
            cp -r infra/compose-prod/grafana artifacts/ 2>/dev/null || true
          fi

      - name: Deploy via SSM
        run: |
          chmod +x .github/scripts/ssm-deploy.sh
          .github/scripts/ssm-deploy.sh .github/scripts/deploy-backend.sh \
            VERSION_FULL='${{ needs.build-and-push.outputs.version_full }}' \
            VERSION_SHORT='${{ needs.build-and-push.outputs.version_short }}'
