name: Testing Frontend CI/CD - Probability

on:
  push:
    branches:
      - main
    paths:
      - 'front/testing/**'
      - '.github/workflows/testing-frontend-ci-cd.yml'
  workflow_dispatch:

concurrency:
  group: testing-frontend-deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 476702565908
  IMAGE_NAME: testing-frontend

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    outputs:
      version_full: ${{ steps.version.outputs.VERSION_FULL }}
      version_short: ${{ steps.version.outputs.VERSION_SHORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Generate version
        id: version
        run: |
          chmod +x .github/scripts/generate-version.sh
          .github/scripts/generate-version.sh probability-testing-frontend us-east-1 476702565908

      - name: Build image with Docker (ARM64)
        working-directory: ./front/testing
        env:
          CENTRAL_API_URL: "http://back-central:3050"
          TESTING_API_URL: "http://back-testing:9092"
        run: |
          VERSION_FULL="${{ steps.version.outputs.VERSION_FULL }}"
          VERSION_SHORT="${{ steps.version.outputs.VERSION_SHORT }}"
          SHORT_SHA="${{ steps.version.outputs.SHORT_SHA }}"

          REPO_URL="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/probability-testing-frontend"

          docker build \
            --platform linux/arm64 \
            --no-cache \
            --build-arg CENTRAL_API_URL=${CENTRAL_API_URL} \
            --build-arg TESTING_API_URL=${TESTING_API_URL} \
            -f docker/Dockerfile \
            -t ${REPO_URL}:latest \
            -t ${REPO_URL}:${VERSION_FULL} \
            -t ${REPO_URL}:${VERSION_SHORT} \
            -t ${REPO_URL}:${SHORT_SHA} \
            .

          echo "Imagen construida con 4 tags:"
          echo "   - latest"
          echo "   - ${VERSION_FULL}"
          echo "   - ${VERSION_SHORT}"
          echo "   - ${SHORT_SHA}"

      - name: Push image to ECR
        run: |
          VERSION_FULL="${{ steps.version.outputs.VERSION_FULL }}"
          VERSION_SHORT="${{ steps.version.outputs.VERSION_SHORT }}"
          SHORT_SHA="${{ steps.version.outputs.SHORT_SHA }}"

          REPO_URL="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/probability-testing-frontend"

          echo "Pushing tags to ECR..."
          docker push ${REPO_URL}:latest
          docker push ${REPO_URL}:${VERSION_FULL}
          docker push ${REPO_URL}:${VERSION_SHORT}
          docker push ${REPO_URL}:${SHORT_SHA}

          echo "4 tags pushed successfully"

      - name: Create Git Tag
        run: |
          VERSION_TAG="v${{ steps.version.outputs.VERSION_SHORT }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git tag -d "${VERSION_TAG}" 2>/dev/null || true

          git tag -a "${VERSION_TAG}" -m "Release ${VERSION_TAG} - Testing Frontend

          Image: probability-testing-frontend:${{ steps.version.outputs.VERSION_FULL }}
          Commit: ${{ github.sha }}"

          git push origin "${VERSION_TAG}" --force
          echo "Git tag created/updated: ${VERSION_TAG}"

  deploy:
    name: Deploy to Server (SSM)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Preparar artefactos
        run: |
          mkdir -p artifacts
          cp infra/compose-prod/docker-compose.yaml artifacts/

      - name: Deploy via SSM
        run: |
          chmod +x .github/scripts/ssm-deploy.sh
          .github/scripts/ssm-deploy.sh .github/scripts/deploy-testing-frontend.sh \
            VERSION_FULL='${{ needs.build-and-push.outputs.version_full }}' \
            VERSION_SHORT='${{ needs.build-and-push.outputs.version_short }}'
